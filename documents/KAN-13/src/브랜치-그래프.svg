<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 800" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <style>
    .base { fill: #f6f8fa; stroke: #656d76; stroke-width: 1.3; }
    .doc { fill: #ffffff; stroke: #8c959f; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .br { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.3; }
    .name { fill: #1f2328; font-size: 13px; font-weight: 700; font-family: ui-monospace, Menlo, monospace; }
    .ws { fill: #0969da; font-size: 11px; font-family: ui-monospace, Menlo, monospace; }
    .wsg { fill: #656d76; font-size: 11px; font-family: ui-monospace, Menlo, monospace; }
    .desc { fill: #656d76; font-size: 12px; }
    .lbl { fill: #656d76; font-size: 11px; }
    .edge { stroke: #1f2328; stroke-width: 1.3; fill: none; }
  </style>
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f2328"/></marker>
  </defs>

  <rect x="40" y="20" width="330" height="40" rx="6" class="base"/>
  <text x="60" y="45" class="name">main</text>
  <text x="386" y="45" class="desc">기준 브랜치</text>
  <line x1="205" y1="60" x2="205" y2="86" class="edge" marker-end="url(#g)"/>
  <text x="215" y="80" class="lbl">기반</text>

  <rect x="40" y="88" width="330" height="56" rx="6" class="doc"/>
  <text x="60" y="112" class="name">KAN-13/00-design-doc</text>
  <text x="60" y="132" class="wsg">수정 — documents/ 만</text>
  <text x="386" y="112" class="desc">이 설계문서. 구현 브랜치</text>
  <text x="386" y="130" class="desc">집합에서 제외</text>
  <line x1="205" y1="144" x2="205" y2="170" class="edge" marker-end="url(#g)"/>

  <rect x="40" y="172" width="330" height="56" rx="6" class="br"/>
  <text x="60" y="196" class="name">KAN-13/01-seed-and-contracts</text>
  <text x="60" y="216" class="ws">수정 — packages/contracts · packages/db · data/seed</text>
  <text x="386" y="196" class="desc">시드 데이터·계약 타입·</text>
  <text x="386" y="214" class="desc">시드 검증 테스트</text>
  <line x1="205" y1="228" x2="205" y2="254" class="edge" marker-end="url(#g)"/>

  <rect x="40" y="256" width="330" height="56" rx="6" class="br"/>
  <text x="60" y="280" class="name">KAN-13/02-issuance-engine</text>
  <text x="60" y="300" class="ws">수정 — apps/api</text>
  <text x="386" y="280" class="desc">랜덤 신호·가중치 결합 엔진·</text>
  <text x="386" y="298" class="desc">발급 트리거 인터페이스(순수 함수)</text>
  <line x1="205" y1="312" x2="205" y2="338" class="edge" marker-end="url(#g)"/>

  <rect x="40" y="340" width="330" height="56" rx="6" class="br"/>
  <text x="60" y="364" class="name">KAN-13/03-issue-endpoint</text>
  <text x="60" y="384" class="ws">수정 — apps/api</text>
  <text x="386" y="364" class="desc">발급 API 와 coupons 컬렉션</text>
  <text x="386" y="382" class="desc">저장(직렬화 큐)</text>
  <line x1="205" y1="396" x2="205" y2="422" class="edge" marker-end="url(#g)"/>

  <rect x="40" y="424" width="330" height="56" rx="6" class="br"/>
  <text x="60" y="448" class="name">KAN-13/04-list-endpoints</text>
  <text x="60" y="468" class="ws">수정 — apps/api</text>
  <text x="386" y="448" class="desc">내 쿠폰 조회 API 와</text>
  <text x="386" y="466" class="desc">시민 목록 API</text>
  <line x1="205" y1="480" x2="205" y2="506" class="edge" marker-end="url(#g)"/>

  <rect x="40" y="508" width="330" height="56" rx="6" class="br"/>
  <text x="60" y="532" class="name">KAN-13/05-issue-screen</text>
  <text x="60" y="552" class="ws">수정 — apps/web</text>
  <text x="386" y="532" class="desc">발급 실행 화면과 탭 셸</text>
  <text x="386" y="550" class="desc">(UI 전용 컴포넌트·훅·조립)</text>
  <line x1="205" y1="564" x2="205" y2="590" class="edge" marker-end="url(#g)"/>

  <rect x="40" y="592" width="330" height="56" rx="6" class="br"/>
  <text x="60" y="616" class="name">KAN-13/06-my-coupons-screen</text>
  <text x="60" y="636" class="ws">수정 — apps/web</text>
  <text x="386" y="616" class="desc">내 쿠폰 화면과 거래조건 고지</text>
  <text x="386" y="634" class="desc">(UI 전용 컴포넌트·훅·조립)</text>
  <line x1="205" y1="648" x2="205" y2="674" class="edge" marker-end="url(#g)"/>

  <rect x="40" y="676" width="330" height="56" rx="6" class="br"/>
  <text x="60" y="700" class="name">KAN-13/07-issuance-e2e</text>
  <text x="60" y="720" class="ws">수정 — e2e</text>
  <text x="386" y="700" class="desc">발급 → 내 쿠폰 확인 e2e</text>

  <text x="40" y="768" class="lbl">선형 스택 하나를 gh-stack 으로 관리한다. 화살표는 “아래 브랜치가 위 브랜치를 기반으로 한다”는 뜻이고, 병렬 분기는 없다.</text>
  <text x="40" y="786" class="lbl">각 상자의 “수정 —” 줄이 그 브랜치가 손대는 워크스페이스(01 은 시드 데이터 포함)다.</text>
</svg>
