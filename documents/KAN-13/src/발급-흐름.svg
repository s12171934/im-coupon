<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <style>
    .step { fill: #ffffff; stroke: #1f2328; stroke-width: 1.3; }
    .ui { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.3; }
    .err { fill: #fff5f5; stroke: #cf222e; stroke-width: 1.3; }
    .t { fill: #1f2328; font-size: 12.5px; }
    .tb { fill: #1f2328; font-size: 12.5px; font-weight: 700; }
    .te { fill: #cf222e; font-size: 12.5px; font-weight: 700; }
    .lbl { fill: #656d76; font-size: 11px; }
    .lble { fill: #cf222e; font-size: 11px; }
    .edge { stroke: #1f2328; stroke-width: 1.3; fill: none; }
    .edgee { stroke: #cf222e; stroke-width: 1.2; fill: none; }
    .edged { stroke: #656d76; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
    .mono { font-family: ui-monospace, Menlo, monospace; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f2328"/></marker>
    <marker id="ae" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#cf222e"/></marker>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#656d76"/></marker>
  </defs>

  <!-- 정상 레인 -->
  <rect x="60" y="24" width="420" height="40" rx="8" class="ui"/>
  <text x="270" y="49" text-anchor="middle" class="tb">발급 실행 화면 — 발급 1건 실행 버튼 (시연 트리거)</text>
  <line x1="270" y1="64" x2="270" y2="88" class="edge" marker-end="url(#a)"/>
  <text x="280" y="82" class="lbl mono">POST /api/coupons/issue (weights 선택)</text>

  <rect x="60" y="90" width="420" height="40" rx="4" class="step"/>
  <text x="270" y="115" text-anchor="middle" class="t">발급 가중치 검증 — 숫자·비음수·합&gt;0·아는 신호 키만</text>
  <line x1="270" y1="130" x2="270" y2="154" class="edge" marker-end="url(#a)"/>
  <text x="280" y="148" class="lbl">통과</text>

  <rect x="60" y="156" width="420" height="40" rx="4" class="step"/>
  <text x="270" y="181" text-anchor="middle" class="t">발급 후보 적재 — merchants × citizens 전체 쌍</text>
  <line x1="270" y1="196" x2="270" y2="220" class="edge" marker-end="url(#a)"/>
  <text x="280" y="214" class="lbl">발급 후보 있음</text>

  <rect x="60" y="222" width="420" height="40" rx="4" class="step"/>
  <text x="270" y="247" text-anchor="middle" class="t">가중치 결합 — 랜덤 신호 점수 × weights.random, 총점 최대 선택</text>
  <line x1="270" y1="262" x2="270" y2="286" class="edge" marker-end="url(#a)"/>
  <text x="280" y="280" class="lbl">선택된 발급 후보 1쌍</text>

  <rect x="60" y="288" width="420" height="52" rx="4" class="step"/>
  <text x="270" y="308" text-anchor="middle" class="t">쿠폰 생성 — 소유자 점유 상태, heldUntil·expiresAt 계산,</text>
  <text x="270" y="326" text-anchor="middle" class="t">가맹점명·소유자명·액면·배분 비율 스냅샷</text>
  <line x1="270" y1="340" x2="270" y2="364" class="edge" marker-end="url(#a)"/>

  <rect x="60" y="366" width="420" height="40" rx="4" class="step"/>
  <text x="270" y="391" text-anchor="middle" class="t">coupons 컬렉션 저장 — 프로세스 내 직렬화 큐 + 원자적 쓰기</text>
  <line x1="270" y1="406" x2="270" y2="430" class="edge" marker-end="url(#a)"/>
  <text x="280" y="424" class="lbl">저장 성공</text>

  <rect x="60" y="432" width="420" height="40" rx="8" class="ui"/>
  <text x="270" y="457" text-anchor="middle" class="tb">201 응답 — 발급 결과 카드 표시 (coupon + decision)</text>

  <!-- 이어지는 확인 흐름 -->
  <line x1="270" y1="472" x2="270" y2="500" class="edged" marker-end="url(#ad)"/>
  <text x="280" y="492" class="lbl">사용자가 탭 전환 (별도 요청)</text>
  <rect x="60" y="502" width="420" height="40" rx="8" class="ui"/>
  <text x="270" y="527" text-anchor="middle" class="tb">내 쿠폰 화면 — 소유자 선택</text>
  <line x1="270" y1="542" x2="270" y2="566" class="edge" marker-end="url(#a)"/>
  <text x="280" y="560" class="lbl mono">GET /api/coupons?ownerId=</text>
  <rect x="60" y="568" width="420" height="40" rx="8" class="ui"/>
  <text x="270" y="593" text-anchor="middle" class="tb">쿠폰 카드 + 거래조건 고지 (배분 비율·이중 기한)</text>

  <!-- 오류 레인 -->
  <text x="700" y="49" text-anchor="middle" class="te">실패·경계 흐름</text>

  <line x1="480" y1="110" x2="558" y2="110" class="edgee" marker-end="url(#ae)"/>
  <text x="490" y="103" class="lble">검증 실패</text>
  <rect x="560" y="90" width="280" height="40" rx="4" class="err"/>
  <text x="700" y="115" text-anchor="middle" class="te mono">400 INVALID_WEIGHTS</text>

  <line x1="480" y1="176" x2="558" y2="176" class="edgee" marker-end="url(#ae)"/>
  <text x="490" y="169" class="lble">발급 후보 없음</text>
  <rect x="560" y="156" width="280" height="40" rx="4" class="err"/>
  <text x="700" y="181" text-anchor="middle" class="te mono">422 NO_CANDIDATES</text>

  <line x1="480" y1="386" x2="558" y2="386" class="edgee" marker-end="url(#ae)"/>
  <text x="490" y="379" class="lble">쓰기 실패</text>
  <rect x="560" y="366" width="280" height="40" rx="4" class="err"/>
  <text x="700" y="391" text-anchor="middle" class="te mono">500 STORAGE_FAILURE</text>

  <line x1="700" y1="130" x2="700" y2="446" class="edgee"/>
  <line x1="700" y1="196" x2="700" y2="366" class="edgee"/>
  <line x1="700" y1="406" x2="700" y2="446" class="edgee" marker-end="url(#ae)"/>
  <rect x="560" y="448" width="280" height="52" rx="4" class="err"/>
  <text x="700" y="468" text-anchor="middle" class="te">발급 실행 화면 오류 표시</text>
  <text x="700" y="488" text-anchor="middle" class="te mono">{error.code} · {error.message}</text>

  <text x="60" y="650" class="lbl">파랑 상자는 화면, 흰 상자는 apps/api 단계, 붉은 상자는 8장의 오류 응답이다.</text>
  <text x="60" y="668" class="lbl">세 오류 모두 발급 실행 화면의 오류 영역에 코드·메시지로 표시된다.</text>
</svg>
