<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <style>
    .step { fill: #ffffff; stroke: #1f2328; stroke-width: 1.3; }
    .ui { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.3; }
    .err { fill: #fff5f5; stroke: #cf222e; stroke-width: 1.3; }
    .t { fill: #1f2328; font-size: 12.5px; }
    .tb { fill: #1f2328; font-size: 12.5px; font-weight: 700; }
    .te { fill: #cf222e; font-size: 12.5px; font-weight: 700; }
    .lbl { fill: #656d76; font-size: 11px; }
    .lble { fill: #cf222e; font-size: 11px; }
    .edge { stroke: #1f2328; stroke-width: 1.3; fill: none; }
    .edgee { stroke: #cf222e; stroke-width: 1.2; fill: none; }
    .edged { stroke: #656d76; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
    .mono { font-family: ui-monospace, Menlo, monospace; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f2328"/></marker>
    <marker id="ae" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#cf222e"/></marker>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#656d76"/></marker>
  </defs>

  <!-- 정상 레인 -->
  <rect x="60" y="24" width="420" height="40" rx="8" class="ui"/>
  <text x="270" y="49" text-anchor="middle" class="tb">발급 실행 화면 — 발급 1건 실행 버튼 (시연 트리거)</text>
  <line x1="270" y1="64" x2="270" y2="88" class="edge" marker-end="url(#a)"/>
  <text x="280" y="82" class="lbl mono">POST /api/coupons/issue (weights 선택)</text>

  <rect x="60" y="90" width="420" height="40" rx="4" class="step"/>
  <text x="270" y="115" text-anchor="middle" class="t">요청 본문 모양 판정 — weights 키가 있으면 객체인가</text>
  <line x1="270" y1="130" x2="270" y2="154" class="edge" marker-end="url(#a)"/>
  <text x="280" y="148" class="lbl">모양 통과</text>

  <rect x="60" y="156" width="420" height="40" rx="4" class="step"/>
  <text x="270" y="181" text-anchor="middle" class="t">발급 후보 적재 — merchants × citizens 전체 쌍</text>
  <line x1="270" y1="196" x2="270" y2="220" class="edge" marker-end="url(#a)"/>
  <text x="280" y="214" class="lbl">적재 성공</text>

  <rect x="60" y="222" width="420" height="56" rx="4" class="step"/>
  <text x="270" y="244" text-anchor="middle" class="t">발급 가중치 검증·결합 — 요청 덮어쓰기를 기본값과 병합해</text>
  <text x="270" y="264" text-anchor="middle" class="t">값 규칙을 걸고, 랜덤 신호 점수 × 가중치로 총점 최대 선택</text>
  <line x1="270" y1="278" x2="270" y2="302" class="edge" marker-end="url(#a)"/>
  <text x="280" y="296" class="lbl">선택된 발급 후보 1쌍</text>

  <rect x="60" y="304" width="420" height="52" rx="4" class="step"/>
  <text x="270" y="324" text-anchor="middle" class="t">쿠폰 생성 — 소유자 점유 상태, heldUntil·expiresAt 계산,</text>
  <text x="270" y="342" text-anchor="middle" class="t">가맹점명·소유자명·액면·배분 비율 스냅샷</text>
  <line x1="270" y1="356" x2="270" y2="380" class="edge" marker-end="url(#a)"/>
  <text x="280" y="374" class="lbl">쿠폰 레코드 1건</text>

  <rect x="60" y="382" width="420" height="40" rx="4" class="step"/>
  <text x="270" y="407" text-anchor="middle" class="t">coupons 컬렉션 저장 — 프로세스 내 직렬화 큐 + 원자적 쓰기</text>
  <line x1="270" y1="422" x2="270" y2="446" class="edge" marker-end="url(#a)"/>
  <text x="280" y="440" class="lbl">저장 성공</text>

  <rect x="60" y="448" width="420" height="40" rx="8" class="ui"/>
  <text x="270" y="473" text-anchor="middle" class="tb">201 응답 — 발급 결과 카드 표시 (coupon + decision)</text>

  <!-- 이어지는 확인 흐름 -->
  <line x1="270" y1="488" x2="270" y2="516" class="edged" marker-end="url(#ad)"/>
  <text x="280" y="508" class="lbl">사용자가 탭 전환 (별도 요청)</text>
  <rect x="60" y="518" width="420" height="40" rx="8" class="ui"/>
  <text x="270" y="543" text-anchor="middle" class="tb">내 쿠폰 화면 — 소유자 선택</text>
  <line x1="270" y1="558" x2="270" y2="582" class="edge" marker-end="url(#a)"/>
  <text x="280" y="576" class="lbl mono">GET /api/coupons?ownerId=</text>
  <rect x="60" y="584" width="420" height="40" rx="8" class="ui"/>
  <text x="270" y="609" text-anchor="middle" class="tb">쿠폰 카드 + 거래조건 고지 (배분 비율·이중 기한)</text>

  <!-- 오류 레인 -->
  <text x="780" y="49" text-anchor="middle" class="te">실패·경계 흐름</text>

  <line x1="480" y1="110" x2="618" y2="110" class="edgee" marker-end="url(#ae)"/>
  <text x="490" y="103" class="lble">모양 오류</text>
  <rect x="620" y="90" width="320" height="40" rx="4" class="err"/>
  <text x="780" y="115" text-anchor="middle" class="te mono">400 INVALID_BODY</text>

  <line x1="480" y1="176" x2="618" y2="176" class="edgee" marker-end="url(#ae)"/>
  <text x="490" y="169" class="lble">발급 후보 읽기 실패</text>
  <rect x="620" y="156" width="320" height="40" rx="4" class="err"/>
  <text x="780" y="181" text-anchor="middle" class="te mono">500 STORAGE_FAILURE</text>

  <line x1="480" y1="234" x2="618" y2="231" class="edgee" marker-end="url(#ae)"/>
  <text x="490" y="228" class="lble">가중치 검증 실패</text>
  <rect x="620" y="214" width="320" height="34" rx="4" class="err"/>
  <text x="780" y="236" text-anchor="middle" class="te mono">400 INVALID_WEIGHTS</text>

  <line x1="480" y1="266" x2="618" y2="271" class="edgee" marker-end="url(#ae)"/>
  <text x="490" y="262" class="lble">발급 후보 없음</text>
  <rect x="620" y="254" width="320" height="34" rx="4" class="err"/>
  <text x="780" y="276" text-anchor="middle" class="te mono">422 NO_CANDIDATES</text>

  <line x1="480" y1="402" x2="618" y2="402" class="edgee" marker-end="url(#ae)"/>
  <text x="490" y="395" class="lble">쿠폰 쓰기 실패</text>
  <rect x="620" y="382" width="320" height="40" rx="4" class="err"/>
  <text x="780" y="407" text-anchor="middle" class="te mono">500 STORAGE_FAILURE</text>

  <!-- 다섯 오류가 한 자리로 모인다. 상자를 가로지르지 않도록 오른쪽 바깥으로 돌린다 -->
  <line x1="940" y1="110" x2="968" y2="110" class="edgee"/>
  <line x1="940" y1="176" x2="968" y2="176" class="edgee"/>
  <line x1="940" y1="231" x2="968" y2="231" class="edgee"/>
  <line x1="940" y1="271" x2="968" y2="271" class="edgee"/>
  <line x1="940" y1="402" x2="968" y2="402" class="edgee"/>
  <line x1="968" y1="110" x2="968" y2="516" class="edgee"/>
  <line x1="968" y1="516" x2="942" y2="516" class="edgee" marker-end="url(#ae)"/>
  <text x="955" y="478" text-anchor="end" class="lble">오류 응답 본문</text>
  <rect x="620" y="490" width="320" height="52" rx="4" class="err"/>
  <text x="780" y="510" text-anchor="middle" class="te">발급 실행 화면 오류 표시</text>
  <text x="780" y="530" text-anchor="middle" class="te mono">{error.code} · {error.message}</text>

  <text x="60" y="665" class="lbl">파랑 상자는 화면, 흰 상자는 apps/api 단계, 붉은 상자는 8장의 오류 응답이다.</text>
</svg>
